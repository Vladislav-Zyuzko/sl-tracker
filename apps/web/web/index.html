<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Заменяется значением --base-href при сборке. Приложение живёт в корне. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SL Tracker — трекер задач команды.">

  <!--
    Приложение за авторизацией: индексировать нечего, и незачем.
  -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Обе схемы поддерживаются. Браузер благодаря этому красит системные части
    страницы — полосы прокрутки, поля ввода до старта Flutter — в тон схемы,
    а не в светлый по умолчанию (`system.md`, 12.5).
  -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F7FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SL Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SL Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Осмысленный лоадер, пока поднимается движок и грузятся шрифты.
      Цвета взяты из дизайн-системы (surfaceSunken, textMuted, textPrimary,
      borderSubtle, accent) — это единственное место вне Dart, где они
      дублируются, потому что здесь темы ещё нет (`system.md`, 12.5).

      Схема выбирается в три шага, и порядок важен:

        1. собственный ключ `sl.theme.boot` — там лежит УЖЕ ВЫЧИСЛЕННАЯ
           схема (`light` / `dark`), которую приложение записало при явном
           выборе. Скрипт ниже ставит по нему атрибут на <html>;
        2. если ключа нет (первый визит либо режим «как в системе») —
           работает медиа-запрос prefers-color-scheme, то есть настройка ОС;
        3. если JavaScript выключен, шага 1 не происходит вовсе, и остаётся
           тот же медиа-запрос. Поэтому светлые значения объявлены на голом
           :root, а не внутри правила с атрибутом.

      Разбирать формат хранения shared_preferences здесь нельзя — это деталь
      пакета. Отсюда и собственный ключ: договорённость с приложением наша.
    */
    :root {
      --sl-boot-bg: #F4F7FB;
      --sl-boot-text: #5C6C87;
      --sl-boot-title: #26395B;
      --sl-boot-track: #E8EFF5;
      --sl-boot-bar: #1A6CE5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sl-boot-bg: #10141C;
        --sl-boot-text: #99A6BC;
        --sl-boot-title: #DCE3EE;
        --sl-boot-track: #242D3C;
        --sl-boot-bar: #6BA6FF;
      }
    }

    /* Явный выбор перекрывает системную настройку в обе стороны. */
    html[data-sl-scheme="light"] {
      --sl-boot-bg: #F4F7FB;
      --sl-boot-text: #5C6C87;
      --sl-boot-title: #26395B;
      --sl-boot-track: #E8EFF5;
      --sl-boot-bar: #1A6CE5;
    }

    html[data-sl-scheme="dark"] {
      --sl-boot-bg: #10141C;
      --sl-boot-text: #99A6BC;
      --sl-boot-title: #DCE3EE;
      --sl-boot-track: #242D3C;
      --sl-boot-bar: #6BA6FF;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--sl-boot-bg);
    }

    #sl-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--sl-boot-text);
      font-size: 13px;
      line-height: 18px;
    }

    #sl-boot__title {
      color: var(--sl-boot-title);
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    #sl-boot__track {
      width: 160px;
      height: 2px;
      border-radius: 4px;
      background-color: var(--sl-boot-track);
      overflow: hidden;
    }

    #sl-boot__bar {
      width: 40%;
      height: 100%;
      border-radius: 4px;
      background-color: var(--sl-boot-bar);
      animation: sl-boot-slide 1400ms linear infinite;
    }

    @keyframes sl-boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* Уважаем системную настройку «уменьшить движение» и здесь тоже. */
    @media (prefers-reduced-motion: reduce) {
      #sl-boot__bar {
        animation: none;
        width: 100%;
      }
    }
  </style>

  <script>
    // Синхронно и до <body>: атрибут обязан стоять на первом же кадре,
    // иначе человек с тёмной схемой увидит вспышку светлого загрузчика —
    // ровно то, ради чего ключ и заведён.
    (function () {
      var scheme = null;
      try {
        scheme = window.localStorage.getItem('sl.theme.boot');
      } catch (e) {
        // Данные сайта запрещены — остаётся системная настройка.
      }

      if (scheme !== 'light' && scheme !== 'dark') return;

      document.documentElement.setAttribute('data-sl-scheme', scheme);

      // Оба theme-color разводятся медиа-запросом, и браузер берёт первый
      // подходящий. Добавлять третий без media бесполезно — он окажется
      // позже, — поэтому явный выбор просто перезаписывает содержимое обоих.
      var color = scheme === 'dark' ? '#10141C' : '#F4F7FB';
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) {
        metas[i].setAttribute('content', color);
      }
    })();
  </script>
</head>
<body>
  <div id="sl-boot">
    <div id="sl-boot__title">SL Tracker</div>
    <div id="sl-boot__track"><div id="sl-boot__bar"></div></div>
    <div>Загружаем приложение…</div>
  </div>

  <script>
    // Лоадер убирается на первом кадре Flutter, а не по таймеру: иначе
    // пользователь увидит либо пустой экран, либо мигание.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('sl-boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
